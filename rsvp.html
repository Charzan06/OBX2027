<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBX 2027 RSVP</title>

<style>

body{
font-family:Arial,sans-serif;
background:#06243d;
color:white;
padding:25px;
}

.box{
background:white;
color:#111;
border-radius:20px;
padding:25px;
max-width:500px;
margin:auto;
}

h1{
text-align:center;
}

input, select{
width:100%;
padding:14px;
margin:8px 0;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

button{
width:100%;
padding:16px;
margin-top:12px;
border:none;
border-radius:15px;
font-size:18px;
font-weight:bold;
}

.yes{
background:#0284c7;
color:white;
}

.no{
background:#ddd;
}


</style>

</head>


<body>


<div class="box">


<h1>
🔥 RSVP
</h1>


<button class="yes" onclick="showForm()">
😎 Hell Yes, I'm In
</button>


<button class="no" onclick="window.location.href='index.html'">
😢 No, I'm a Loser
</button>



<div id="form" style="display:none;">


<input id="name" placeholder="Your Name">


<input id="adults" type="number" placeholder="Number of Adults">


<input id="kids" type="number" placeholder="Number of Kids">


<input id="ages" placeholder="Kids Ages (optional)">



<button class="yes" onclick="saveRSVP()">

Submit RSVP

</button>


</div>


</div>




<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { getFirestore, collection, addDoc } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyAmdsdhHQagqHIbhtY1JhEmsvpNBtGcYKo",

authDomain: "obx2027-5a536.firebaseapp.com",

projectId: "obx2027-5a536",

storageBucket: "obx2027-5a536.firebasestorage.app",

messagingSenderId: "1003642407899",

appId: "1:1003642407899:web:2961f1f362189db10db5fe"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



window.showForm=function(){

document.getElementById("form").style.display="block";

}



window.saveRSVP=async function(){


await addDoc(collection(db,"rsvps"),{

name:document.getElementById("name").value,

adults:Number(document.getElementById("adults").value),

kids:Number(document.getElementById("kids").value),

kidsAges:document.getElementById("ages").value,

attending:true,

date:new Date()

});


alert("RSVP Saved!");


window.location.href="index.html";


}


</script>


</body>

</html>
