<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBX 2027 RSVP</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Inter',sans-serif;
}

body{

min-height:100vh;

background:
linear-gradient(
rgba(3,40,70,.65),
rgba(3,20,40,.85)
),
url("images/2027%20OBX%20INFOHUB.png");

background-size:cover;

background-position:center;

background-attachment:fixed;

padding:25px;

color:white;

}


.container{

max-width:500px;

margin:40px auto;

}


.card{

background:rgba(255,255,255,.95);

color:#0f172a;

padding:30px;

border-radius:30px;

box-shadow:0 20px 50px rgba(0,0,0,.3);

}


h1{

text-align:center;

font-size:2.5rem;

margin-bottom:10px;

}


.subtitle{

text-align:center;

margin-bottom:25px;

}


button{

width:100%;

padding:18px;

border:none;

border-radius:18px;

font-size:1.1rem;

font-weight:900;

margin-top:15px;

cursor:pointer;

}


.yes{

background:#0284c7;

color:white;

}


.home{

background:#082f49;

color:white;

}


input{

width:100%;

padding:15px;

margin-top:12px;

border-radius:12px;

border:1px solid #ccc;

font-size:16px;

}


label{

display:block;

margin-top:15px;

font-weight:700;

}


#form{

display:none;

}


.success{

display:none;

text-align:center;

font-weight:bold;

font-size:1.2rem;

}


</style>

</head>


<body>


<div class="container">


<div class="card">


<h1>
🔥 RSVP
</h1>


<p class="subtitle">
Operation OBX 2027
</p>


<div id="start">


<button class="yes" onclick="showForm()">

😎 Hell Yes, I'm In

</button>


<button class="home" onclick="goHome()">

Back to Main Page

</button>


</div>


<div id="form">


<label>
Your Name
</label>

<input id="name" placeholder="Who are you?">


<label>
Adults
</label>

<input id="adults" type="number" placeholder="How many adults?">


<label>
Kids
</label>

<input id="kids" type="number" placeholder="How many kids?">


<label>
Kids Ages (optional)
</label>

<input id="ages" placeholder="Example: 5, 8, 10">


<button class="yes" onclick="submitRSVP()">

Submit RSVP

</button>


</div>


<div id="success" class="success">

🔥 You're on the list!<br><br>

Sending you back...

</div>


</div>


</div><script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getFirestore, 
collection, 
addDoc 
} from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyAmdsdhHQagqHIbhtY1JhEmsvpNBtGcYKo",

authDomain: "obx2027-5a536.firebaseapp.com",

projectId: "obx2027-5a536",

storageBucket: "obx2027-5a536.firebasestorage.app",

messagingSenderId: "1003642407899",

appId: "1:1003642407899:web:2961f1f362189db10db5fe"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



window.showForm = function(){

document.getElementById("start").style.display="none";

document.getElementById("form").style.display="block";

}



window.goHome = function(){

window.location.href="index.html";

}



window.submitRSVP = async function(){


const name = document.getElementById("name").value;

const adults = document.getElementById("adults").value;

const kids = document.getElementById("kids").value;

const ages = document.getElementById("ages").value;



if(!name){

alert("Please enter your name");

return;

}



await addDoc(collection(db,"rsvps"),{


name:name,

adults:Number(adults || 0),

kids:Number(kids || 0),

kidsAges:ages,

attending:true,

approved:false,

timestamp:new Date()


});



document.getElementById("form").style.display="none";

document.getElementById("success").style.display="block";



setTimeout(()=>{

window.location.href="index.html";

},2500);



}


</script>


</body>

</html>
