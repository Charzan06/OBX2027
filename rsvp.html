
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBX 2027 RSVP</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');


*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Inter,Arial,sans-serif;
}


body{

background:
linear-gradient(
180deg,
#082f49,
#0284c7
);

min-height:100vh;

color:#0f172a;

padding:25px 18px;

}



.container{

max-width:500px;

margin:auto;

padding-top:30px;

}



.logo{

text-align:center;

color:white;

font-size:1.2rem;

font-weight:900;

margin-bottom:25px;

}



.card{

background:white;

border-radius:30px;

padding:25px;

box-shadow:
0 20px 50px rgba(0,0,0,.25);

}



h1{

text-align:center;

font-size:2.2rem;

font-weight:900;

margin-bottom:10px;

}



.subtitle{

text-align:center;

color:#475569;

margin-bottom:30px;

line-height:1.5;

}



.choice{

display:block;

width:100%;

padding:20px;

border-radius:25px;

border:none;

margin:15px 0;

font-size:1.2rem;

font-weight:900;

cursor:pointer;

}



.yes{

background:#22c55e;

color:white;

}


.no{

background:#ef4444;

color:white;

}



.hidden{

display:none;

}



label{

display:block;

font-weight:800;

margin-top:18px;

margin-bottom:8px;

}



input, textarea{

width:100%;

padding:15px;

border-radius:15px;

border:2px solid #e2e8f0;

font-size:1rem;

}



.counter{

display:flex;

align-items:center;

justify-content:space-between;

background:#e0f2fe;

padding:15px;

border-radius:20px;

margin-top:10px;

}



.counter button{

width:45px;

height:45px;

border:none;

border-radius:50%;

background:#0284c7;

color:white;

font-size:1.5rem;

font-weight:900;

}



.number{

font-size:1.5rem;

font-weight:900;

}



.submit{

margin-top:25px;

width:100%;

padding:18px;

border:none;

border-radius:30px;

background:#082f49;

color:white;

font-size:1.1rem;

font-weight:900;

}



.message{

text-align:center;

padding:20px;

font-size:1.2rem;

font-weight:800;

}



</style>

</head>


<body>


<div class="container">


<div class="logo">
🌊 OPERATION OBX 2027

<br>

<a href="index.html" style="
color:white;
font-size:.9rem;
text-decoration:none;
">
← Back to Command Center
</a>

</div>


<div class="card">


<h1>
RSVP
</h1>


<p class="subtitle">
The most important question of the year:
Are you joining the Outer Banks invasion?
</p>



<div id="start">


<button class="choice yes" onclick="showForm()">

🔥 HELL YES, I'M IN

</button>



<button class="choice no" onclick="showNo()">

😢 NO, I'M A LOSER

</button>


</div>





<div id="form" class="hidden">


<label>
Who are you?
</label>


<input id="name" placeholder="Your name">



<label>
How many adults?
</label>


<div class="counter">

<button onclick="changeAdult(-1)">−</button>

<div class="number" id="adults">
1
</div>

<button onclick="changeAdult(1)">+</button>

</div>





<label>
How many kids?
</label>


<div class="counter">

<button onclick="changeKids(-1)">−</button>

<div class="number" id="kids">
0
</div>

<button onclick="changeKids(1)">+</button>

</div>





<label>
Kids ages (optional)
</label>


<input id="ages" placeholder="Example: 5, 8, 12">





<label>
Message (optional)
</label>


<textarea id="message" rows="4"
placeholder="Can't wait! Bringing cornhole!"></textarea>




<button class="submit" onclick="submitRSVP()">

SAVE MY RSVP

</button>



</div>





<div id="result" class="message hidden">

</div>



</div>


</div>





<script>


let adults=1;

let kids=0;



function showForm(){

document.getElementById("start").style.display="none";

document.getElementById("form").classList.remove("hidden");

}



function showNo(){

document.getElementById("start").innerHTML=

`
<div class="message">
😭 We are disappointed.<br><br>
Your beach chair will remain empty.
</div>
`;

}




function changeAdult(amount){

adults+=amount;

if(adults<0) adults=0;

document.getElementById("adults").innerHTML=adults;

}



function changeKids(amount){

kids+=amount;

if(kids<0) kids=0;

document.getElementById("kids").innerHTML=kids;

}




function submitRSVP(){


let name=document.getElementById("name").value;


if(!name){

alert("Tell us who you are first!");

return;

}



document.getElementById("form").innerHTML=

`

<div class="message">

🔥 YOU'RE IN! 🔥

<br><br>

${name}<br>

Adults: ${adults}<br>

Kids: ${kids}

<br><br>

OBX 2027 officially has another crew member.

<br><br>

<a href="index.html" style="
display:block;
background:#082f49;
color:white;
padding:15px;
border-radius:25px;
text-decoration:none;
margin-top:20px;
">
← Return to Command Center
</a>

</div>

`;
}



</script>


</body>

</html>
