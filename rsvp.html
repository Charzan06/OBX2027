<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBX 2027 RSVP</title>

<style>

body{
margin:0;
padding:20px;
min-height:100vh;
font-family:Arial,sans-serif;
background:#06243d;
color:white;
}

.card{
max-width:500px;
margin:40px auto;
background:white;
color:#111;
padding:30px;
border-radius:25px;
}

h1{
text-align:center;
color:#0284c7;
}

button,input{
width:100%;
padding:15px;
margin-top:12px;
border-radius:12px;
font-size:16px;
}

button{
border:0;
font-weight:bold;
cursor:pointer;
}

.yes{
background:#0284c7;
color:white;
}

.back{
background:#082f49;
color:white;
}

input{
border:1px solid #ccc;
}

#form{
display:none;
}

#status{
margin-top:20px;
text-align:center;
font-weight:bold;
}

</style>

</head>


<body>


<div class="card">

<h1>🔥 RSVP</h1>

<p style="text-align:center;">
Operation OBX 2027
</p>


<div id="start">

<button class="yes" onclick="startRSVP()">
🔥 Hell Yes, I'm In
</button>

<button class="back" onclick="location.href='index.html'">
😢 No, I'm a Loser
</button>

</div>


<div id="form">

<input id="adultNames" placeholder="Adult Names (Example: Joe & Sue)">

<input id="adults" type="number" placeholder="Number of Adults">

<input id="kids" type="number" placeholder="Number of Kids">

<input id="ages" placeholder="Kids Ages (optional)">


<button class="yes" onclick="saveRSVP()">
Submit RSVP
</button>


</div>


<div id="status"></div>


</div>



<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getFirestore, collection, addDoc } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyAmdsdhHQagqHIbhtY1JhEmsvpNBtGcYKo",

authDomain: "obx2027-5a536.firebaseapp.com",

projectId: "obx2027-5a536",

storageBucket: "obx2027-5a536.firebasestorage.app",

messagingSenderId: "1003642407899",

appId: "1:1003642407899:web:2961f1f362189db10db5fe"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


window.startRSVP = function(){

document.getElementById("start").style.display="none";

document.getElementById("form").style.display="block";

}



window.saveRSVP = async function(){

try{


await addDoc(collection(db,"rsvps"),{

adultNames: document.getElementById("adultNames").value,

adults: Number(document.getElementById("adults").value || 0),

kids: Number(document.getElementById("kids").value || 0),

kidsAges: document.getElementById("ages").value,

attending:true,

approved:false,

created:new Date()

});


document.getElementById("status").innerHTML =
"🔥 RSVP SAVED!<br><br>Sending you back...";


setTimeout(function(){

window.location.href="index.html";

},3000);


}

catch(error){

document.getElementById("status").innerHTML =
"ERROR: " + error.message;

console.log(error);

}


}


</script>


</body>

</html>
