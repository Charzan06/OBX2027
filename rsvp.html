<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBX 2027 RSVP</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
padding:25px;
background:
linear-gradient(rgba(0,40,70,.65),rgba(0,20,40,.85)),
url("images/2027%20OBX%20INFOHUB.png");

background-size:cover;
background-position:center;
color:white;
}


.box{
max-width:500px;
margin:40px auto;
background:white;
color:#111;
padding:30px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.3);
}


h1{
text-align:center;
color:#0284c7;
}


p{
text-align:center;
}


button{
width:100%;
padding:16px;
margin-top:15px;
border:0;
border-radius:15px;
font-size:18px;
font-weight:bold;
}


.yes{
background:#0284c7;
color:white;
}


.back{
background:#082f49;
color:white;
}


input{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}


#form{
display:none;
}


#message{
text-align:center;
margin-top:20px;
font-weight:bold;
}


</style>

</head>


<body>


<div class="box">

<h1>
🔥 RSVP
</h1>

<p>
Operation OBX 2027
</p>


<div id="start">

<button class="yes" onclick="showForm()">
😎 Hell Yes, I'm In
</button>


<button class="back" onclick="goHome()">
Back To Main Page
</button>

</div>


<div id="form">


<input id="name" placeholder="Your Name">


<input id="adults" type="number" placeholder="Number of Adults">


<input id="kids" type="number" placeholder="Number of Kids">


<input id="ages" placeholder="Kids Ages (optional)">


<button class="yes" onclick="submitRSVP()">
Submit RSVP
</button>


</div>

<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getFirestore,
collection,
addDoc
} from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyAmdsdhHQagqHIbhtY1JhEmsvpNBtGcYKo",

authDomain: "obx2027-5a536.firebaseapp.com",

projectId: "obx2027-5a536",

storageBucket: "obx2027-5a536.firebasestorage.app",

messagingSenderId: "1003642407899",

appId: "1:1003642407899:web:2961f1f362189db10db5fe"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


window.showForm = function(){

document.getElementById("start").style.display="none";

document.getElementById("form").style.display="block";

}


window.goHome = function(){

window.location.href="index.html";

}



window.submitRSVP = async function(){


try{


const data = {

name: document.getElementById("name").value,

adults: Number(document.getElementById("adults").value || 0),

kids: Number(document.getElementById("kids").value || 0),

kidsAges: document.getElementById("ages").value,

attending: true,

approved: false,

created: new Date().toISOString()

};


const docRef = await addDoc(
collection(db,"rsvps"),
data
);


document.getElementById("message").innerHTML =
"🔥 SAVED!<br><br>Document ID:<br>" + docRef.id;


setTimeout(function(){

window.location.href="index.html";

},5000);


}


catch(error){


document.getElementById("message").innerHTML =
"ERROR:<br>" + error.message;


}


}


</script>


</body>

</html>
