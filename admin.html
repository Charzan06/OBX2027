<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBX Admin RSVP</title>

<style>

body{
font-family:Arial,sans-serif;
background:#082f49;
color:white;
padding:20px;
}

h1{
text-align:center;
}

.stats{
max-width:650px;
margin:20px auto;
background:#0ea5e9;
padding:20px;
border-radius:20px;
font-size:1.1rem;
font-weight:bold;
}

.card{
background:white;
color:#111;
max-width:650px;
margin:20px auto;
padding:25px;
border-radius:20px;
}

.rsvp{
border:2px solid #0284c7;
padding:15px;
border-radius:15px;
margin-top:15px;
}

.name{
font-size:1.35rem;
font-weight:bold;
color:#0284c7;
}

.date{
font-size:.9rem;
color:#64748b;
margin-top:8px;
}

.statusApproved{
color:#16a34a;
font-weight:bold;
}

.statusWaiting{
color:#ca8a04;
font-weight:bold;
}

button{
padding:12px;
border:none;
border-radius:12px;
font-weight:bold;
margin-top:10px;
margin-right:8px;
cursor:pointer;
}

.approve{
background:#16a34a;
color:white;
}

.unapprove{
background:#eab308;
color:black;
}

.delete{
background:#dc2626;
color:white;
}

</style>

</head>

<body>

<h1>🔥 OBX 2027 RSVP Admin</h1>

<div class="stats" id="stats">
Loading totals...
</div>

<div class="card">

<div id="list">

Loading RSVPs...

</div>

</div><script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getFirestore,
collection,
getDocs,
doc,
updateDoc,
deleteDoc
} from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyAmdsdhHQagqHIbhtY1JhEmsvpNBtGcYKo",

authDomain: "obx2027-5a536.firebaseapp.com",

projectId: "obx2027-5a536",

storageBucket: "obx2027-5a536.firebasestorage.app",

messagingSenderId: "1003642407899",

appId: "1:1003642407899:web:2961f1f362189db10db5fe"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



async function loadRSVPs(){


const snapshot = await getDocs(collection(db,"rsvps"));


let people=[];


snapshot.forEach((item)=>{

people.push({

id:item.id,

...item.data()

});

});


// newest first

people.sort((a,b)=>{

let dateA = a.created?.toDate ? a.created.toDate() : new Date(0);

let dateB = b.created?.toDate ? b.created.toDate() : new Date(0);

return dateB-dateA;

});



let html="";


let adults=0;

let kids=0;



people.forEach((r)=>{


const displayName = r.adultNames || r.name || "No Name";


adults += Number(r.adults || 0);

kids += Number(r.kids || 0);



let submitted="Unknown";


if(r.created?.toDate){

submitted = r.created.toDate().toLocaleString();

}



html += `


<div class="rsvp">


<div class="name">

🔥 ${displayName}

</div>


<br>


Adults: ${r.adults || 0}

<br>

Kids: ${r.kids || 0}

<br>

Kids Ages: ${r.kidsAges || "none"}


<br><br>


<div class="${r.approved ? "statusApproved":"statusWaiting"}">

${r.approved ? "✅ Approved" : "🟡 Waiting Approval"}

</div>



<div class="date">

Submitted: ${submitted}

</div>



<br>


<button class="approve"

onclick="approve('${r.id}')">

✅ Approve

</button>



<button class="unapprove"

onclick="unapprove('${r.id}')">

↩️ Unapprove

</button>



<button class="delete"

onclick="removeRSVP('${r.id}')">

🗑 Delete

</button>



</div>


`;



});



document.getElementById("list").innerHTML =

html || "No RSVPs yet.";



document.getElementById("stats").innerHTML =

"RSVPs: " + people.length +

"<br>Adults: " + adults +

"<br>Kids: " + kids +

"<br>Total People: " + (adults + kids);



}



window.approve = async function(id){


await updateDoc(doc(db,"rsvps",id),{

approved:true

});


loadRSVPs();


}



window.unapprove = async function(id){


await updateDoc(doc(db,"rsvps",id),{

approved:false

});


loadRSVPs();


}



window.removeRSVP = async function(id){


await deleteDoc(doc(db,"rsvps",id));


loadRSVPs();


}



loadRSVPs();


</script>


</body>

</html>
