<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBX Admin</title>


<style>

body{
font-family:Arial,sans-serif;
background:#06243d;
color:white;
padding:20px;
}


.card{
background:white;
color:#111;
max-width:700px;
margin:20px auto;
padding:25px;
border-radius:20px;
}


h1,h2{
text-align:center;
}


input,textarea,button{
width:100%;
padding:14px;
margin-top:10px;
border-radius:10px;
font-size:16px;
box-sizing:border-box;
}


button{
border:0;
font-weight:bold;
cursor:pointer;
}


.loginBtn{
background:#0284c7;
color:white;
}


.approve{
background:#16a34a;
color:white;
}


.delete{
background:#dc2626;
color:white;
}


.edit{
background:#f59e0b;
color:white;
}


.logout{
background:#082f49;
color:white;
}


.rsvp,.message{
border:2px solid #0284c7;
padding:15px;
border-radius:15px;
margin-top:15px;
}


.name{
font-size:1.2rem;
font-weight:bold;
color:#0284c7;
}


.hidden{
display:none;
}


</style>


</head>


<body>


<h1>
🔥 OBX 2027 Admin
</h1>



<div id="loginBox" class="card">


<h2>
🔒 Admin Login
</h2>


<input id="email" type="email" placeholder="Email">


<input id="password" type="password" placeholder="Password">


<button class="loginBtn" onclick="login()">

LOGIN

</button>


<div id="loginStatus"></div>


</div>




<div id="adminArea" class="hidden">


<div class="card">


<button class="logout" onclick="logout()">

LOGOUT

</button>


</div>


<div class="card">


<h2>
👥 RSVPs
</h2>


<div id="rsvpList">

Loading RSVPs...

</div>


</div>


<div class="card">


<h2>
💬 Messages
</h2>


<div id="messageList">

Loading Messages...

</div>


</div>


</div><script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,

collection,

getDocs,

doc,

updateDoc,

deleteDoc,

query,

orderBy

} from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {

getAuth,

signInWithEmailAndPassword,

signOut,

onAuthStateChanged

} from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig = {

apiKey: "AIzaSyAmdsdhHQagqHIbhtY1JhEmsvpNBtGcYKo",

authDomain: "obx2027-5a536.firebaseapp.com",

projectId: "obx2027-5a536",

storageBucket: "obx2027-5a536.firebasestorage.app",

messagingSenderId: "1003642407899",

appId: "1:1003642407899:web:2961f1f362189db10db5fe"

};



const app = initializeApp(firebaseConfig);


const db = getFirestore(app);


const auth = getAuth(app);





// LOGIN


window.login = async function(){


const email =
document.getElementById("email").value;


const password =
document.getElementById("password").value;



try{


await signInWithEmailAndPassword(

auth,

email,

password

);



}

catch(error){


document.getElementById("loginStatus").innerHTML =

"❌ Login failed";


console.log(error);


}


}





// LOGOUT


window.logout = function(){


signOut(auth);


}





// WATCH LOGIN STATE


onAuthStateChanged(auth,(user)=>{


if(user){


document.getElementById("loginBox").style.display="none";


document.getElementById("adminArea").style.display="block";


loadRSVPs();


loadMessages();


}


else{


document.getElementById("loginBox").style.display="block";


document.getElementById("adminArea").style.display="none";


}


});
// LOAD RSVPS

async function loadRSVPs(){


const snapshot = await getDocs(
collection(db,"rsvps")
);


let html="";


snapshot.forEach((item)=>{


const r=item.data();


let name = r.adultNames || r.name || "No Name";


html += `

<div class="rsvp">


<div class="name">

🔥 ${name}

</div>


<br>

Adults: ${r.adults || 0}

<br>

Kids: ${r.kids || 0}

<br>

Kids Ages: ${r.kidsAges || "none"}


<br><br>


Status:

${r.approved ? "✅ Approved" : "🟡 Waiting"}



<button class="approve"

onclick="toggleApprove('${item.id}',${r.approved || false})">

${r.approved ? "↩️ Remove Approval" : "✅ Approve"}

</button>



<button class="delete"

onclick="deleteRSVP('${item.id}')">

🗑 Delete RSVP

</button>



</div>

`;



});



document.getElementById("rsvpList").innerHTML =

html || "No RSVPs yet";


}




// APPROVE / UNAPPROVE


window.toggleApprove = async function(id,current){


await updateDoc(

doc(db,"rsvps",id),

{

approved: !current

}

);


loadRSVPs();


}




// DELETE RSVP


window.deleteRSVP = async function(id){


if(confirm("Delete this RSVP?")){


await deleteDoc(

doc(db,"rsvps",id)

);


loadRSVPs();


}


}
// LOAD MESSAGES


async function loadMessages(){


const q = query(

collection(db,"messages"),

orderBy("created","desc")

);



const snapshot = await getDocs(q);


let html="";



snapshot.forEach((item)=>{


const m=item.data();


html += `


<div class="message">


<b>${m.name || "Unknown"}</b>


<br><br>


<div>

${m.message || ""}

</div>


<button class="edit"

onclick="editMessage('${item.id}')">

✏️ Edit

</button>



<button class="delete"

onclick="deleteMessage('${item.id}')">

🗑 Delete

</button>


</div>


`;



});



document.getElementById("messageList").innerHTML =

html || "No messages yet.";


}




// EDIT MESSAGE


window.editMessage = async function(id){


const newText = prompt(

"New message text:"

);



if(!newText){

return;

}



await updateDoc(

doc(db,"messages",id),

{

message:newText

}

);



loadMessages();


}




// DELETE MESSAGE


window.deleteMessage = async function(id){


if(confirm("Delete this message?")){


await deleteDoc(

doc(db,"messages",id)

);


loadMessages();


}


}



</script>


</body>

</html>
