<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBX 2027 Admin RSVP</title>

<style>

body{
font-family:Arial,sans-serif;
background:#082f49;
color:white;
padding:20px;
}

h1{
text-align:center;
}

.stats{
max-width:600px;
margin:20px auto;
background:#0ea5e9;
padding:20px;
border-radius:20px;
font-size:1.1rem;
font-weight:bold;
}

.card{
background:white;
color:#111;
max-width:600px;
margin:20px auto;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.rsvp{
border:2px solid #0284c7;
padding:15px;
border-radius:15px;
margin-top:15px;
}

.name{
font-size:1.3rem;
font-weight:bold;
color:#0284c7;
}

.date{
font-size:.9rem;
color:#64748b;
}

button{
padding:12px;
border:none;
border-radius:12px;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

.approve{
background:#16a34a;
color:white;
}

.delete{
background:#dc2626;
color:white;
}

</style>

</head>


<body>


<h1>
🔥 OBX 2027 RSVP Admin
</h1>


<div class="stats" id="stats">
Loading totals...
</div>


<div class="card">

<div id="list">
Loading RSVPs...
</div>

</div>



<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getFirestore,
collection,
getDocs,
doc,
updateDoc,
deleteDoc
} from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyAmdsdhHQagqHIbhtY1JhEmsvpNBtGcYKo",

authDomain: "obx2027-5a536.firebaseapp.com",

projectId: "obx2027-5a536",

storageBucket: "obx2027-5a536.firebasestorage.app",

messagingSenderId: "1003642407899",

appId: "1:1003642407899:web:2961f1f362189db10db5fe"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



async function loadRSVPs(){

const snapshot = await getDocs(collection(db,"rsvps"));


let people=[];


snapshot.forEach((item)=>{

people.push({
id:item.id,
...item.data()
});

});


// newest first

people.sort((a,b)=>
new Date(b.created || 0) - new Date(a.created || 0)
);



let html="";

let adults=0;

let kids=0;


people.forEach((r)=>{


adults += Number(r.adults || 0);

kids += Number(r.kids || 0);


html += `

<div class="rsvp">


<div class="name">

🔥 ${r.name || "No Name"}

</div>


<br>

Adults: ${r.adults || 0}

<br>

Kids: ${r.kids || 0}

<br>

Kids Ages: ${r.kidsAges || "none"}

<br><br>

Approved:

${r.approved ? "✅ YES" : "❌ NO"}


<br><br>

<div class="date">

Submitted:
${r.created ? new Date(r.created).toLocaleString() : "Unknown"}

</div>


<br>


<button class="approve" onclick="approve('${r.id}')">

✅ Approve

</button>


<button class="delete" onclick="removeRSVP('${r.id}')">

🗑 Delete

</button>


</div>

`;

});


document.getElementById("list").innerHTML =
html || "No RSVPs yet.";


document.getElementById("stats").innerHTML =

"RSVPs: " + people.length +

"<br>Adults: " + adults +

"<br>Kids: " + kids +

"<br>Total People: " + (adults+kids);



}



window.approve = async function(id){

await updateDoc(doc(db,"rsvps",id),{

approved:true

});

loadRSVPs();

}



window.removeRSVP = async function(id){

await deleteDoc(doc(db,"rsvps",id));

loadRSVPs();

}



loadRSVPs();


</script>


</body>

</html>
