<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBX 2027 Admin RSVP</title>

<style>

body{
font-family:Arial,sans-serif;
background:#082f49;
color:white;
padding:20px;
}

h1{
text-align:center;
}

.card{
background:white;
color:#111;
max-width:600px;
margin:20px auto;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.rsvp{
border:2px solid #0284c7;
padding:15px;
border-radius:15px;
margin-top:15px;
}

.name{
font-size:1.3rem;
font-weight:bold;
color:#0284c7;
}

button{
padding:12px;
border:none;
border-radius:12px;
font-weight:bold;
margin-top:10px;
cursor:pointer;
}

.approve{
background:#16a34a;
color:white;
}

.delete{
background:#dc2626;
color:white;
}

#error{
color:red;
font-weight:bold;
}

</style>

</head>


<body>


<h1>
🔥 OBX 2027 RSVP Admin
</h1>


<div class="card">

<div id="list">
Loading RSVPs...
</div>

<div id="error"></div>

</div>



<script type="module">


import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getFirestore,
collection,
getDocs,
doc,
updateDoc,
deleteDoc
} from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyAmdsdhHQagqHIbhtY1JhEmsvpNBtGcYKo",

authDomain: "obx2027-5a536.firebaseapp.com",

projectId: "obx2027-5a536",

storageBucket: "obx2027-5a536.firebasestorage.app",

messagingSenderId: "1003642407899",

appId: "1:1003642407899:web:2961f1f362189db10db5fe"

};



const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



async function loadRSVPs(){

try{


const querySnapshot = await getDocs(collection(db,"rsvps"));


let html = "";


if(querySnapshot.empty){

html = "No RSVPs found.";

}


querySnapshot.forEach((item)=>{


const r = item.data();


html += `

<div class="rsvp">

<div class="name">
🔥 ${r.name || "No Name"}
</div>

<br>

Adults: ${r.adults || 0}

<br>

Kids: ${r.kids || 0}

<br>

Kids Ages: ${r.kidsAges || "none"}

<br><br>

Approved:
${r.approved ? "YES ✅" : "NO ❌"}

<br>


<button class="approve" onclick="approve('${item.id}')">
✅ Approve
</button>


<button class="delete" onclick="removeRSVP('${item.id}')">
🗑 Delete
</button>


</div>

`;

});


document.getElementById("list").innerHTML = html;


}

catch(error){

document.getElementById("list").innerHTML =
"Firebase Error";

document.getElementById("error").innerHTML =
error.message;

console.log(error);

}


}



window.approve = async function(id){

await updateDoc(doc(db,"rsvps",id),{

approved:true

});

loadRSVPs();

}



window.removeRSVP = async function(id){

await deleteDoc(doc(db,"rsvps",id));

loadRSVPs();

}



loadRSVPs();


</script>


</body>

</html>
